          .split(/[-_]/)
          .map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase())

            const svg = window.lucide.createElement(iconDef);
            if (className) svg.setAttribute('class', className);
            spanRef.current.replaceChildren(svg);
          } catch (e) {
            console.warn("Lucide render error:", name, e);
          }

                        className="w-full py-4 rounded-xl bg-[#B8E94E] hover:bg-[#C9F55C] disabled:opacity-50 text-[#10251C] font-black font-sans text-xs sm:text-sm uppercase tracking-widest shadow-xl shadow-[#B8E94E]/25 flex items-center justify-center gap-2 transition-all hover:scale-[1.01] cursor-pointer"
                      >
                        {discussSubmitting ? (
                          <span>Sending Inquiry...</span>
                        ) : (
                          <span className="flex items-center gap-2">
                            <span>Submit Inquiry — Let's Discuss</span>
                            <LucideIcon name="arrow-right" className="w-4 h-4 text-[#10251C]" />
                          </span>
                        )}
                      </button>
                    </form>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
