        if (!window.lucide) return;

        const cleanName = String(name).trim();
        const pascal = cleanName
          .split(/[-_]/)
          .map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase())
          .join('');

        const allIcons = window.lucide.icons || window.lucide;
        const iconDef = allIcons[pascal] || allIcons[cleanName];

        if (iconDef && window.lucide.createElement) {

            const svg = window.lucide.createElement(iconDef);
            if (className) svg.setAttribute('class', className);
            spanRef.current.replaceChildren(svg);
          } catch (e) {
            console.warn("Lucide render error:", name, e);
          }
        }
      }, [name, className]);

                    {/* Address */}

                      <div className="flex flex-col text-left">

                        <span className="text-zinc-900 font-bold text-xs sm:text-sm">Ahmedabad, Gujarat</span>
                        <span className="text-zinc-500 text-xs mt-0.5">Satyam Complex, 18, Science City Rd</span>
                      </div>
                    </div>
                  </div>

                </div>
              </div>

              <div className="pt-8 border-t border-zinc-200 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-mono text-zinc-500">

              <div className="relative w-full max-w-2xl bg-white border border-zinc-200 rounded-3xl p-8 space-y-6 shadow-2xl text-[#10251C]">
                <button onClick={() => setAuditModalOpen(false)} className="absolute top-4 right-4 w-9 h-9 rounded-full bg-zinc-100 hover:bg-zinc-200 text-zinc-700 transition-all flex items-center justify-center cursor-pointer z-10">

                  </div>
                  <h3 className="text-2xl font-black uppercase text-[#10251C]">60-SECOND BRAND & GROWTH AUDIT</h3>
                  <p className="text-xs text-zinc-600">Uncover content gaps, conversion bottlenecks, and tech scaling opportunities in real-time.</p>
                </div>

                {!auditResultData ? (
                  <form onSubmit={handleRunAudit} className="space-y-4 pt-2">
                    <div>
                      <label className="block text-xs font-mono text-zinc-800 font-semibold mb-1.5 uppercase">Your Website URL or Brand Name</label>
                      <input type="text" required value={auditBrandInput} onChange={(e) => setAuditBrandInput(e.target.value)} placeholder="e.g. www.mybrand.com" className="w-full px-4 py-3 rounded-xl bg-[#F8FAF8] border border-zinc-300 text-zinc-900 text-sm focus:border-[#10251C] focus:bg-white focus:outline-none shadow-xs" />
                    </div>
                    <div>
                      <label className="block text-xs font-mono text-zinc-800 font-semibold mb-1.5 uppercase">Biggest Current Bottleneck / Challenge</label>
                      <input type="text" required value={auditChallengeInput} onChange={(e) => setAuditChallengeInput(e.target.value)} placeholder="e.g. High ad costs, low lead response rate, generic content" className="w-full px-4 py-3 rounded-xl bg-[#F8FAF8] border border-zinc-300 text-zinc-900 text-sm focus:border-[#10251C] focus:bg-white focus:outline-none shadow-xs" />

                      {auditLoading ? <span>Analyzing Brand Architecture & Content...</span> : <>Run AI Growth Audit</>}

                    </div>

                    <form onSubmit={handleDiscussSubmit} className="space-y-4 sm:space-y-5">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-[11px] sm:text-xs font-mono uppercase tracking-wider text-zinc-700 font-bold mb-1.5">

                          <input

                            WORK EMAIL
                          </label>
                          <input
                            type="email"
                            required
                            placeholder="e.g. alex@brand.com"
                            value={discussEmail}

                        <div>
                          <label className="block text-[11px] sm:text-xs font-mono uppercase tracking-wider text-zinc-700 font-bold mb-1.5">
                            BRAND / COMPANY
                          </label>
                          <input
                            type="text"
                            required
                            placeholder="e.g. Vanguard Luxury"
                            value={discussBrand}
                            onChange={(e) => setDiscussBrand(e.target.value)}

                        </div>

                        <div>
                          <label className="block text-[11px] sm:text-xs font-mono uppercase tracking-wider text-zinc-700 font-bold mb-1.5">
                            PHONE / WHATSAPP
                          </label>
                          <input
                            type="tel"
                            required
                            placeholder="e.g. +1 (555) 019-2834"
                            value={discussPhone}
                            onChange={(e) => setDiscussPhone(e.target.value)}
                            className="w-full px-4 py-3 sm:py-3.5 rounded-xl bg-[#F8FAF8] border border-zinc-300 focus:border-[#10251C] focus:bg-white text-zinc-900 text-xs sm:text-sm placeholder-zinc-400 outline-none transition-colors shadow-xs"
                          />
                        </div>

                        <div className="col-span-1 sm:col-span-2">
                          <label className="block text-[11px] sm:text-xs font-mono uppercase tracking-wider text-zinc-700 font-bold mb-1.5">

                          <textarea
                            rows={3}
                            placeholder="Describe your revenue targets, ad budgets, or custom software requirements..."

                            onChange={(e) => setDiscussNotes(e.target.value)}
                            className="w-full px-4 py-3 sm:py-3.5 rounded-xl bg-[#F8FAF8] border border-zinc-300 focus:border-[#10251C] focus:bg-white text-zinc-900 text-xs sm:text-sm placeholder-zinc-400 outline-none transition-colors resize-y min-h-[95px] shadow-xs"
                          />

                      </div>

                      <button
                        type="submit"
                        disabled={discussSubmitting}
                        className="w-full py-4 rounded-xl bg-[#B8E94E] hover:bg-[#C9F55C] disabled:opacity-50 text-[#10251C] font-black font-sans text-xs sm:text-sm uppercase tracking-widest shadow-xl shadow-[#B8E94E]/25 flex items-center justify-center gap-2 transition-all hover:scale-[1.01] cursor-pointer border border-[#10251C]/10"

                        {discussSubmitting ? (
                          <span>Sending Inquiry...</span>

                          <span className="flex items-center gap-2">
                            <span>Submit Inquiry — Let's Discuss</span>
                            <LucideIcon name="arrow-right" className="w-4 h-4 text-[#10251C]" />
                          </span>
                        )}
                      </button>
                    </form>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
